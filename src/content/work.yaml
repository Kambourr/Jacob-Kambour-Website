- id: delivery-center-estimator
  title: Delivery Center Estimator
  summary: >-
    A macOS desktop app that asks what a new Tesla delivery center in any US
    ZIP code would cost per delivery and return over ten years, using a
    gravity catchment and a DCF built only from public data.
  image: delivery-center-estimator.png
  tags: [Financial modeling, Geospatial analysis]
  caseStudyPath: work/delivery-center-estimator/
  imageAlt: >-
    Screenshot of the Delivery Center Estimator app with ZIP 94402 in San
    Mateo selected: a dark map of the Peninsula with the catchment shaded,
    and a dashboard showing $619 per delivery, 5,565 deliveries a year, cost
    drivers and cash flow. Model estimates from public data.
  order: 2
