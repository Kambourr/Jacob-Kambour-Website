- id: delivery-center-estimator
  title: Delivery Center Estimator
  tagline: >-
    A tool that estimates what a new Tesla delivery center in any US ZIP code
    would cost per delivery and return over ten years, using public data.
  summary: >-
    A macOS desktop app that asks what a new Tesla delivery center in any US
    ZIP code would cost per delivery and return over ten years, using a
    gravity catchment and a DCF built only from public data.
  image: delivery-center-estimator.png
  tags: [Financial modeling, Geospatial analysis]
  caseStudyPath: work/delivery-center-estimator/
  imageAlt: >-
    Screenshot of the Delivery Center Estimator app with ZIP 94402 in San
    Mateo selected: a dark map of the Peninsula with the catchment shaded,
    and a dashboard showing $619 per delivery, 5,565 deliveries a year, cost
    drivers and cash flow. Model estimates from public data.
  order: 2
- id: etch-portfolio-forecast
  title: Etch Portfolio Spend Forecast
  tagline: >-
    A tool that builds an Opex and Capex forecast for Etch R&D programs from
    your inputs, bridges it to the budget, and exports Excel. Illustrative data.
  summary: >-
    An Excel model and a web app that forecast a fiscal year of Opex and Capex
    for Etch R&D programs. Enter programs, drivers, an AOP and actuals, and it
    blends a rolling forecast, bridges it to the budget, tests a funding cut
    and a schedule slip, follows Capex into depreciation, runs 11 checks, and
    exports a live-formula Excel workbook. Illustrative numbers.
  image: etch-portfolio-forecast.png
  tags: [Financial modeling, Excel]
  caseStudyPath: work/etch-portfolio-forecast/
  imageAlt: >-
    Chart from the model: a bridge from the $61.97M annual operating plan to
    the $60.23M Base forecast by line, next to a card showing a $60.2M FY27
    forecast, $1.7M under plan, with all 11 model checks passing. Illustrative
    data.
  order: 3
